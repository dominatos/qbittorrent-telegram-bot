# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  review_details: true
  path_filters:
    - "**"
    - "!**/.git/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.lock"
  path_instructions:
    - path: "**/*.php"
      instructions: |
        Focus on Telegram bot command safety, qBittorrent API error handling, input validation, access control, retries, and user-visible failure modes.
        Flag secret leakage, unsafe shelling out, and unbounded background work.
    - path: "**/*.{yml,yaml,json,*}"
      instructions: |
        Review config defaults, bot permissions, torrent path settings, and exposed credentials.

auto_review:
  enabled: true
  drafts: false

chat:
  auto_reply: true
